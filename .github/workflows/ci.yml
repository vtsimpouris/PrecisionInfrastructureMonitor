name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  unit-tests:
    name: Build and Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build C# service
        run: >
          dotnet build
          PrecisionInfrastructureMonitor/PrecisionInfrastructureMonitor.csproj
          --configuration Release

      - name: Run C# unit tests
        run: >
          dotnet test
          PrecisionInfrastructureMonitor.Tests/PrecisionInfrastructureMonitor.Tests.csproj
          --configuration Release
          --no-restore

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Run Python unit tests
        working-directory: scripts
        run: python -m pytest -q test_residuals.py


  system-tests:
    name: Docker System Tests
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Build Docker image
        run: |
          docker build \
            -t precision-infra-monitor \
            ./PrecisionInfrastructureMonitor

      - name: Start system under test
        run: |
          docker run -d \
            --name precision-monitor \
            -p 7060:8080 \
            --mount type=bind,source="${{ github.workspace }}/PrecisionInfrastructureMonitor/config",target=/app/config \
            precision-infra-monitor

      - name: Wait for service
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:7060/config/health; then
              exit 0
            fi

            sleep 1
          done

          docker logs precision-monitor
          exit 1

      - name: Run Gherkin system tests
        working-directory: scripts
        run: python -m pytest -q test_bdd.py

      - name: Run integration tests
        working-directory: scripts
        run: python -m pytest -q test_integration.py

      - name: Show service logs on failure
        if: failure()
        run: docker logs precision-monitor || true

      - name: Clean up container
        if: always()
        run: docker rm -f precision-monitor || true